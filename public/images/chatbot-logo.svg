<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gbDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023328"/>
      <stop offset="100%" stop-color="#001F18"/>
    </linearGradient>
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#4EEDB2" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Clean dark green squircle: NO outer halo, NO white circle, pure transparent corners -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#gbDarkBg)" stroke="#064E3B" stroke-width="1.5"/>

  <!-- Glowing mint chat bubble outline matching exact user design -->
  <path d="M33 32 C33 28.5 35.8 26 39.5 26 H60.5 C64.2 26 67 28.5 67 32 V48 C67 51.5 64.2 54 60.5 54 H41 L33 62 V32 Z" 
        fill="none" 
        stroke="#4EEDB2" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#mintGlow)" />
</svg>
